services:
  nicebot:
    build: .
    image: nicebot:latest
    container_name: nicebot
    restart: unless-stopped
    environment:
      # SQLite-Leveldatenbank im Volume
      - DB_PATH=/app/data/level_system.db
      # config.json beschreibbar gemountet (/einstellungen speichert dorthin)
      - CONFIG_PATH=/app/config/config.json
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - npm-web
# Kein Port-Mapping: weiterhin kein eingehender HTTP-Traffic.
# npm-web (externes NPM-Netz) ist NUR fuer den Outbound-Call des
# /verknuepfen-Commands noetig: der Bot muss turnier-backend:3130 erreichen,
# und der Turnier-Backend-Container haengt im NPM-Netz.

networks:
  default:
    driver: bridge
  npm-web:
    external: true
    name: nginx-proxy-manager_web_net
